<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#ffffff" stroke="#111111" stroke-width="16"/>
  <!-- Karate Gi Lapels -->
  <path d="M120 480 L256 310 L392 480 Z" fill="#f4f4f5" stroke="#18181b" stroke-width="8"/>
  <path d="M160 512 L256 350 L352 512 Z" fill="#ffffff"/>
  <!-- Black Belt -->
  <rect x="180" y="440" width="152" height="32" rx="6" fill="#18181b"/>
  <path d="M256 460 L240 500 L272 500 Z" fill="#18181b"/>
  <!-- Calligraphy Kanji 押忍 -->
  <g fill="#18181b" font-family="'Shippori Mincho', 'Yuji Boku', serif" font-weight="900" text-anchor="middle">
    <text x="256" y="200" font-size="140" letter-spacing="4">押</text>
    <text x="256" y="340" font-size="140" letter-spacing="4">忍</text>
  </g>
  <!-- Red Sun Seal Stamp (Hanko) -->
  <rect x="360" y="80" width="70" height="70" rx="10" fill="#dc2626"/>
  <text x="395" y="130" font-size="44" font-family="serif" font-weight="bold" fill="#ffffff" text-anchor="middle">極</text>
</svg>
